<title>Artifact Smoke Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    --ground: #f2f3f0;
    --panel: #fbfbfa;
    --ink: #1b1e1a;
    --muted: #5f665c;
    --line: #d7dad2;
    --signal: #3f7d3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14160f;
      --panel: #1c1f18;
      --ink: #eef0e9;
      --muted: #99a293;
      --line: #2e3328;
      --signal: #8fce7f;
    }
  }
  :root[data-theme="dark"] {
    --ground: #14160f;
    --panel: #1c1f18;
    --ink: #eef0e9;
    --muted: #99a293;
    --line: #2e3328;
    --signal: #8fce7f;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    box-sizing: border-box;
  }

  main {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2rem 2.25rem;
    max-width: 34rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .label::before {
    content: "";
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--signal);
  }

  p {
    margin: 0;
    font-size: 1.35rem;
    line-height: 1.45;
    text-wrap: balance;
  }

  footer {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
</style>

<main>
  <div class="label">Publish check</div>
  <p>If you can read this line, publishing artifacts from this session works.</p>
  <footer>house-rules · 2026-09-07</footer>
</main>
