name: verify

# verify.py is this repo's stated source of truth for whether a change took effect
# (CLAUDE.md), so it runs on every push and every pull request rather than only when
# somebody remembers. It needs no dependencies: hook.py and verify.py are stdlib-only
# and run.sh is POSIX sh, both of which a stock ubuntu runner already has.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_plugin_version_bump.py diffs against origin/main, which needs history the
          # default shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the hook test suite
        run: python claude-house-rules/plugins/house-rules/scripts/verify.py

      # tools/ had no automated coverage at all until 2.15.0, and that gap cost something
      # real: clean_install_test.py's cleanliness check contradicted its own strip step and
      # was found only by running the script twice by hand.
      - name: Run the tools test suite
        run: python tools/verify_tools.py

      # A push to main only happens via an already-checked PR merge, so re-checking there is
      # redundant noise rather than a gap - this only runs on the PR itself.
      - name: Block a plugin-file change with no version bump
        if: github.event_name == 'pull_request'
        run: python tools/check_plugin_version_bump.py --base ${{ github.event.pull_request.base.sha }}

      # Both offshoots below are shells (docs/offshoots-plan.md) but ship the same
      # fail-open/fail-loud contracts house-rules does, so they get the same CI coverage from
      # day one rather than waiting until they feel load-bearing enough to bother.
      - name: Run the prompt-workshop test suite
        run: python claude-prompt-workshop/plugins/prompt-workshop/scripts/verify.py

      - name: Run the agent-router test suite
        run: python claude-agent-router/plugins/agent-router/scripts/verify.py
