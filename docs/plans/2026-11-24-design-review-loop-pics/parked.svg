<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13">
<style>
.bg{fill:#fff}.t{fill:#1b1f2a}.m{fill:#5b6275}.ln{stroke:#8a92a6;fill:none;stroke-width:1.5}
.new{fill:#fde0dc;stroke:#c0392b}.you{fill:#dbe7ff;stroke:#2f5fd0}.reuse{fill:#dff3e4;stroke:#2e8b57}.adapt{fill:#fff1cc;stroke:#b8860b}
@media (prefers-color-scheme:dark){.bg{fill:#14171f}.t{fill:#eef0f6}.m{fill:#a4abbd}.ln{stroke:#6c748a}.new{fill:#4a1f1b;stroke:#ff8a7a}.you{fill:#1d2c55;stroke:#7aa2ff}.reuse{fill:#1f3a2a;stroke:#5fcf8c}.adapt{fill:#4a3d12;stroke:#e0b94a}}
</style>
<rect class="bg" width="680" height="230"/>
<text class="t" x="16" y="24" font-weight="700">A question comes up mid-build: park it, keep working, answer once</text>
<g stroke-width="1.5">
<rect class="adapt" x="16" y="42" width="140" height="56" rx="8"/><text class="t" x="86" y="66" text-anchor="middle">Question appears</text><text class="m" x="86" y="84" text-anchor="middle" font-size="11">reversible?</text>
<rect class="new" x="190" y="42" width="150" height="56" rx="8"/><text class="t" x="265" y="66" text-anchor="middle">Take the safe default</text><text class="m" x="265" y="84" text-anchor="middle" font-size="11">write it in the ledger</text>
<rect class="reuse" x="374" y="42" width="130" height="56" rx="8"/><text class="t" x="439" y="66" text-anchor="middle">Keep building</text><text class="m" x="439" y="84" text-anchor="middle" font-size="11">no stop</text>
<rect class="you" x="538" y="42" width="126" height="56" rx="8"/><text class="t" x="601" y="66" text-anchor="middle">One batch</text><text class="m" x="601" y="84" text-anchor="middle" font-size="11">on the QA page</text>
<rect class="you" x="16" y="136" width="324" height="56" rx="8"/><text class="t" x="178" y="160" text-anchor="middle">Not reversible, or touches money, secrets,</text><text class="t" x="178" y="178" text-anchor="middle">other people, or deletes data: ask now</text>
</g>
<g class="ln"><path d="M156 70h34M340 70h34M504 70h34M86 98v38"/></g>
<text class="m" x="94" y="122" font-size="11">no</text><text class="m" x="162" y="62" font-size="11">yes</text>
<text class="m" x="360" y="166">Only these still stop the work.</text>
</svg>
