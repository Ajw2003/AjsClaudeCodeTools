<rect class="you" x="16" y="200" width="150" height="48" rx="8"/><text class="t" x="91" y="219" text-anchor="middle">Wait: 2.90.0 merges</text><text class="m" x="91" y="235" text-anchor="middle" font-size="10">issues #587 to #591</text>
