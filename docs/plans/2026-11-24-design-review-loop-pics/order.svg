<rect class="reuse" x="156" y="40" width="112" height="44" rx="8"/><text class="t" x="212" y="59" text-anchor="middle">2 Stamp</text><text class="m" x="212" y="75" text-anchor="middle" font-size="10">#594</text>
<rect class="reuse" x="296" y="40" width="112" height="44" rx="8"/><text class="t" x="352" y="59" text-anchor="middle">3 Acceptance run</text><text class="m" x="352" y="75" text-anchor="middle" font-size="10">#595</text>
<rect class="reuse" x="436" y="40" width="112" height="44" rx="8"/><text class="t" x="492" y="59" text-anchor="middle">5 Self-judging test</text><text class="m" x="492" y="75" text-anchor="middle" font-size="10">#597</text>
