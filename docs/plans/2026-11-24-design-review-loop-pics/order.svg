<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12">
<style>
.bg{fill:#fff}.t{fill:#1b1f2a}.m{fill:#5b6275}.ln{stroke:#8a92a6;fill:none;stroke-width:1.5}
.new{fill:#fde0dc;stroke:#c0392b}.reuse{fill:#dff3e4;stroke:#2e8b57}.adapt{fill:#fff1cc;stroke:#b8860b}.you{fill:#dbe7ff;stroke:#2f5fd0}
