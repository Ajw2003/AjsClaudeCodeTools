<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-label="Today a picture sits in a folder that is not sent with the page, so it breaks; proposed, the picture is inside the page file, so it always shows">
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#17202e}.bx{fill:#fff;stroke:#566174;stroke-width:2}.bad{fill:#fbe1e3;stroke:#b4232f;stroke-width:2}.ok{fill:#dff3e8;stroke:#1f7a4d;stroke-width:2}.b{fill:#e3eafc}.t{font-weight:700}.ar{stroke:#566174;stroke-width:2;fill:none}</style>
<rect width="360" height="290" class="b"/>
<text x="16" y="26" class="t">Today: the picture is left behind</text>
<rect x="16" y="40" width="100" height="62" rx="6" class="bx"/><text x="30" y="76">page file</text>
<rect x="150" y="40" width="100" height="62" rx="6" class="bad" stroke-dasharray="5 4"/><text x="164" y="68">folder with</text><text x="164" y="86">pictures</text>
<text x="262" y="76" class="t" style="fill:#b4232f">not sent</text>
<path d="M66 102V122" class="ar"/>
<rect x="16" y="122" width="100" height="50" rx="6" class="bad"/><line x1="40" y1="134" x2="92" y2="160" stroke="#b4232f" stroke-width="3"/><line x1="92" y1="134" x2="40" y2="160" stroke="#b4232f" stroke-width="3"/>
<text x="130" y="152">broken picture</text>
<text x="16" y="206" class="t">Proposed: the picture is inside</text>
<rect x="16" y="220" width="150" height="58" rx="6" class="ok"/><rect x="28" y="232" width="40" height="34" rx="3" class="bx"/><polygon points="34,260 46,244 56,254 62,248 64,260" fill="#2f5bd3"/><text x="78" y="246">one file,</text><text x="78" y="264">always shows</text>
<text x="184" y="246">Sent, published,</text><text x="184" y="264">moved, or offline.</text>
</svg>
