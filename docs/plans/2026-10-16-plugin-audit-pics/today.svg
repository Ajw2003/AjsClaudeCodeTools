.5"/><text x="32" y="287" class="ink" font-size="14" text-anchor="start" font-weight="bold">Stop (1)</text><text x="32" y="304" class="mute" font-size="11" text-anchor="start" font-weight="normal">handover (8 checkpoint rows)</text><line x1="540" y1="290" x2="600" y2="230" class="line" stroke-width="1.2"/><rect x="20" y="320" width="520" height="44" rx="8" class="box" stroke-width="1.5"/><text x="32" y="339" class="ink" font-size="14" text-anchor="start" font-weight="bold">Subagent start / stop (4)</text><text x="32" y="356" class="mute" font-size="11" text-anchor="start" font-weight="normal">announce, subagentrules, verdict, subagentcommit</text><line x1="540" y1="342" x2="600" y2="230" class="line" stroke-width="1.2"/><rect x="20" y="372" width="520" height="44" rx="8" class="box" stroke-width="1.5"/><text x="32" y="391" class="ink" font-size="14" text-anchor="start" font-weight="bold">Permission / failure (2)</text><text x="32" y="408" class="mute" font-size="11" text-anchor="start" font-weight="normal">prompttimer, promptran</text><line x1="540" y1="394" x2="600" y2="230" class="line" stroke-width="1.2"/><rect x="600" y="180" width="150" height="100" rx="8" class="hot" stroke-width="1.5"/><text x="675" y="215" class="ink" font-size="16" text-anchor="middle" font-weight="bold">hook.py</text><text x="675" y="236" class="mute" font-size="12" text-anchor="middle" font-weight="normal">8,365 lines</text><text x="675" y="254" class="mute" font-size="12" text-anchor="middle" font-weight="normal">284 functions</text><text x="675" y="272" class="mute" font-size="12" text-anchor="middle" font-weight="normal">35 on/off switches</text><line x1="750" y1="230" x2="800" y2="90" class="line" stroke-width="1.2"/><rect x="800" y="70" width="280" height="44" rx="8" class="warm" stroke-width="1.5"/><text x="812" y="89" class="ink" font-size="13" text-anchor="start" font-weight="bold">Temp folder</text><text x="812" y="106" class="mute" font-size="11" text-anchor="start" font-weight=