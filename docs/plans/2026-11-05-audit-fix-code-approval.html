<!doctype html>
<!-- house-rules make_page 2.75.0 -->
<meta charset="utf-8">
<title>Audit Fixes: All the Code, for Approval</title><!-- also set this to PAGE.title: galleries read this tag, not the script -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a four-step walkthrough. One step on screen at a time; a stepper on top; the same wrap-up block closes every page. */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#17202e; --muted:#566174; --line:#d5dbe6;
  --accent:#2f5bd3; --accent-soft:#e3eafc;
  --you:#b35f00; --you-soft:#fdeed9;
  --ok:#1f7a4d; --ok-soft:#dff3e8; --gap:#b4232f; --gap-soft:#fbe1e3;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --card:#18202d; --fg:#eef2f8; --muted:#a4afc0; --line:#2d3748;
  --accent:#86a7ff; --accent-soft:#1f2c4a; --you:#f2b35c; --you-soft:#3a2a12;
  --ok:#62d69d; --ok-soft:#173527; --gap:#ff8089; --gap-soft:#3d1a1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --card:#18202d; --fg:#eef2f8; --muted:#a4afc0; --line:#2d3748;
  --accent:#86a7ff; --accent-soft:#1f2c4a; --you:#f2b35c; --you-soft:#3a2a12;
  --ok:#62d69d; --ok-soft:#173527; --gap:#ff8089; --gap-soft:#3d1a1f; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.ico{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* stepper */
.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper button{border:0;background:none;display:grid;justify-items:center;gap:4px;padding:4px 0;font-size:.72rem;color:var(--muted)}
.stepper .bar{width:100%;height:6px;border-radius:3px;background:var(--line)}
.stepper button.done .bar{background:var(--accent)}
.stepper button[aria-current="step"]{color:var(--fg);font-weight:700}
.stepper button[aria-current="step"] .bar{background:var(--accent)}

.panel{display:grid;gap:18px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.lead{font-size:1.1rem}

/* at-a-glance strip */
.glance{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.g{display:grid;justify-items:center;gap:4px;width:56px;text-align:center;font-size:.72rem;color:var(--muted)}
.g span.c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.g.you span.c{border-radius:12px;background:var(--you-soft);color:var(--you)}
.arrow{color:var(--muted);font-size:1.1rem}
.g{border:0;background:none;padding:0;cursor:pointer}
.lk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--you-soft);color:var(--you);margin-right:6px;vertical-align:-5px}
.glance .lk .ico{width:14px;height:14px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.crb{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.crb.you{border-color:var(--you);background:var(--you-soft)}
.crh{display:flex;gap:6px;align-items:center;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.crb.you .crh{color:var(--you)}
.crh .ico{width:16px;height:16px}
.crb p,.crb li{font-size:.9rem}
.crb ul.cl{margin:0;padding-left:1.1em;display:grid;gap:4px}
.g.done span.c{background:var(--ok-soft);color:var(--ok);border-radius:50%}
.g[aria-pressed="true"] span.c{outline:3px solid var(--accent);outline-offset:2px}
.g.you[aria-pressed="true"] span.c{outline-color:var(--you)}
.g[aria-pressed="true"]{color:var(--fg);font-weight:700}
.sd{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px;font-size:.94rem}
.sd h3{display:flex;gap:8px;align-items:center}
.sd .back{padding-left:0}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.key i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent)}
.key i.y{border-radius:4px;background:var(--you-soft);border-color:var(--you)}

/* stage list */
.stages{display:grid;gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px}
.st > summary{list-style:none;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;min-height:48px}
.st > summary::-webkit-details-marker{display:none}
.st .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.st.you .c{border-radius:11px;background:var(--you-soft);color:var(--you)}
.st.you{border-color:var(--you)}
.st .nm b{display:block}
.st .nm small{color:var(--muted);font-size:.85rem}
.more{font-size:.78rem;color:var(--accent);font-weight:700;white-space:nowrap}
details[open] > summary .more::after{content:" ▲"} details:not([open]) > summary .more::after{content:" ▼"}
.detail{padding:0 14px 14px 68px;display:grid;gap:8px;font-size:.92rem}
@media (max-width:420px){.detail{padding-left:14px}}
.row{display:grid;grid-template-columns:72px 1fr;gap:8px}
.row > span:first-child{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.back{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--you);padding-left:12px}

/* created / changed */
.cc{display:grid;gap:8px}
.ci{background:var(--card);border:1px solid var(--line);border-radius:12px}
.ci > summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;cursor:pointer;min-height:48px}
.ci > summary::-webkit-details-marker{display:none}
.tag{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.new{background:var(--ok-soft);color:var(--ok)} .tag.chg{background:var(--accent-soft);color:var(--accent)} .tag.keep{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.ci b{display:block}
.ci small{color:var(--muted);font-size:.86rem}
.ci .detail{padding:0 14px 14px 14px}
.fromto{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-size:.88rem}
.fromto span{border-radius:8px;padding:6px 8px;background:var(--bg)}
.fromto span.to{background:var(--accent-soft)}
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:stretch;font-size:.84rem}
.flow > span{border-radius:8px;padding:8px;background:var(--bg);display:grid;gap:2px;align-content:start;min-width:0}
.flow > span.mid{background:var(--accent-soft)}
.flow > i{align-self:center;color:var(--muted);font-style:normal}
.flow small{font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
@media (max-width:479px){.flow{grid-template-columns:minmax(0,1fr)}.flow > i{justify-self:center;transform:rotate(90deg)}}
.files{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.files h4{margin:0;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.86rem;align-items:baseline}
.frow code{font-size:.82rem;word-break:break-all}
.files .n{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.parts{margin:0 0 4px;padding-left:18px;display:grid;gap:4px;font-size:.86rem}
.parts li span:first-child{margin-right:8px}

/* choices */
.q{display:grid;gap:8px}
.q h3{display:flex;gap:10px;align-items:flex-start}
.qn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--bg);font:800 .85rem var(--display);flex:none}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-height:48px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input[type=radio]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.opt small{display:block;color:var(--muted);font-size:.86rem}
.owntext{display:block;width:100%;box-sizing:border-box;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--bg);color:var(--fg);min-height:44px}
.rec{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.rec .ico{width:12px;height:12px}
.why{font-size:.88rem}
.why summary{cursor:pointer;color:var(--accent);font-weight:700;min-height:32px}
.why p{margin-top:6px;color:var(--muted)}

/* wrap-up */
.wrapup{display:grid;gap:10px}
.wu{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.wu .c{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.wu h3{margin-bottom:2px}
.wu p,.wu li{font-size:.94rem}
.wu ol{margin:4px 0 0;padding-left:20px;display:grid;gap:4px}
.wu.do{border:2px solid var(--you)}
.reply{display:grid;gap:8px}
.reply pre{white-space:pre-wrap;margin:0;background:var(--card);border:1px dashed var(--accent);border-radius:10px;padding:12px;font-size:.92rem}
.primary{background:var(--accent);color:var(--bg);border:0;border-radius:12px;padding:14px 18px;font-weight:800;min-height:48px}
.secondary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav .primary{margin-left:auto}
.status{font-size:.88rem;color:var(--muted)}
.missing{color:var(--gap);font-weight:700}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .2s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

.pic{display:grid;gap:6px;justify-items:start;max-width:100%;min-width:0}
.pic button{display:grid;gap:6px;justify-items:start;max-width:100%;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:left}
.pic img,.cmp img{display:block;max-width:100%;height:auto;background:var(--bg)}
.pic,.pic button{width:100%;box-sizing:border-box}

.pic figcaption,.cmp figcaption{font-size:.86rem;color:var(--muted)}
.pic,.cmp{margin:0}
.cmp{display:grid;gap:6px;min-width:0}
.cmp-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
body{overflow-wrap:anywhere}
.crb p,.crb li,.fromto span,.flow > span,.ci .detail p,.sd{overflow-wrap:anywhere;min-width:0}
@media (max-width:479px){.cr{grid-template-columns:minmax(0,1fr)}}
.cmp-side > div{display:grid;gap:4px;align-content:start;min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card)}
.cmp-side b,.cmp-slide label{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cmp-slide{display:none;gap:6px;min-width:0}
.cmp-frame{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}

@media (max-width:639px){.cmp-side{display:none}.cmp-slide{display:grid}}
dialog.lightbox{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:12px;width:min(96vw,960px);max-height:94vh;box-sizing:border-box;overflow:auto}
dialog.lightbox::backdrop{background:rgba(0,0,0,.6)}
dialog.lightbox img{display:block;width:100%;height:auto}
dialog.lightbox p{margin-top:8px;font-size:.9rem}
dialog.lightbox button{margin-top:10px}
</style>

<!--
  Handover page template (house-rules, issue #233). The approved format: four parts in this order -
  In short, Changes, Choices, Wrap-up - and a part is left out only when it would be empty.
  Copy this file, edit PAGE below, and nothing else. Every part keeps four rules:
  detail only on tap; names, never bare numbers; one colour, one meaning (orange = the user acts,
  green = done, nothing else orange); I check it first (phone width, light and dark, every tap,
  a bare-number search). Rule: rules/detail/show-dont-tell.md.
-->
<div class="wrap">
  <header style="display:grid;gap:6px">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
  </header>
  <nav class="stepper" aria-label="Steps" id="stepper"></nav>
  <section class="panel" data-part="short" aria-labelledby="h-short">
    <h2 id="h-short" tabindex="-1">In short</h2>
    <div class="card">
      <p class="lead" id="lead"></p>
      <div class="key" id="key"></div>
      <div class="glance" id="glance" role="group" aria-label="Tap an item for detail."></div>
      <p class="muted" style="font-size:.85rem" id="hint"></p>
      <div class="sd" id="sd" aria-live="polite"></div>
    </div>
  </section>
  <section class="panel" data-part="changes" aria-labelledby="h-changes" hidden>
    <h2 id="h-changes" tabindex="-1">What this creates or changes</h2>
    <p class="muted" id="cc-count"></p>
    <div class="cc" id="cc"></div>
  </section>
  <section class="panel" data-part="choices" aria-labelledby="h-choices" hidden>
    <h2 id="h-choices" tabindex="-1">Your choices</h2>
    <p class="muted">My suggestion is marked, nothing is picked for you, and each has room for your own answer.</p>
    <div id="qs" style="display:grid;gap:22px"></div>
  </section>
  <section class="panel" data-part="wrapup" aria-labelledby="h-wrapup" hidden>
    <h2 id="h-wrapup" tabindex="-1">Wrap-up</h2>
    <div class="wrapup" id="wrapup"></div>
    <div class="reply">
      <pre id="out" aria-live="polite"></pre>
      <p class="status" id="miss"></p>
      <button class="primary" id="copy" type="button">Copy my reply</button>
      <p class="status" id="st"></p>
    </div>
  </section>
  <div class="nav">
    <button class="secondary" id="prev" type="button">‹ Back</button>
    <button class="primary" id="next" type="button">Next ›</button>
  </div>
</div>

// ---- PAGE: the only part you edit. Example content shows every field. ----------------------

const PAGE = {
  "title": "Audit Fixes: All the Code, for Approval",
  "eyebrow": "Build plan for approval · parent issue #476 (\"Fix the 45 findings from the 2026-11-05 audits, in six steps\") · every fix written out before any source file changes",

const ic = id => `<svg class="ico"><use href="#i-${id}"/></svg>`;

const picOf = (a, from) => a.slice(from).find(x => x && typeof x === "object" && !Array.isArray(x) && (x.src || x.before));
let picN = 0; const PICS = [];
const picHtml = p => {
  if (!p) return "";
  if (p.before && p.after) {
    const id = "cmp" + (picN++), cap = p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : "";
    const im = x => `<img src="${esc(x.src)}" alt="${esc(x.alt || p.caption || "")}">`;
    return `<figure class="cmp"><div class="cmp-side"><div><b>Before</b>${im(p.before)}</div><div><b>After</b>${im(p.after)}</div></div>
      <div class="cmp-slide"><div class="cmp-frame">${im(p.before)}${im(p.after)}</div><label for="${id}">Reveal after over before: drag to compare</label><input type="range" id="${id}" min="0" max="100" value="50" aria-label="Compare before and after: ${esc(p.caption || "")}"></div>${cap}</figure>`;
  }
  const alt = p.alt || p.caption || "", k = PICS.push({ src: p.src, alt, caption: p.caption || "" }) - 1;
  return `<figure class="pic"><button type="button" data-pic="${k}" aria-label="Open full width: ${esc(alt)}"><img src="${esc(p.src)}" alt="${esc(alt)}">${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ""}</button></figure>`;
};
