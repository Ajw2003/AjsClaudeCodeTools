<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="system-ui,Segoe UI,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566174"/></marker></defs><rect x="0" y="0" width="760" height="600" rx="16" fill="#ffffff"/><text x="24" y="36" font-size="19" fill="#17202e" font-weight="700">Pickup: a new session starts where the last one stopped</text><rect x="24" y="56" width="712" height="62" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="36" y="78" font-size="13" fill="#566174" font-weight="700">1. A session starts</text><text x="36" y="98" font-size="13" fill="#17202e" font-weight="400">any Claude account, this folder or a fresh clone; a folder that isn't a git repo is skipped</text><line x1="380" y1="118" x2="380" y2="150" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="152" width="712" height="72" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="36" y="174" font-size="13" fill="#2f5bd3" font-weight="700">2. Fetch the snapshots from GitHub</text><text x="36" y="194" font-size="13" fill="#17202e" font-weight="400">copied into a separate place so nothing local is overwritten; 5 s limit, and if GitHub</text><text x="36" y="212" font-size="13" fill="#17202e" font-weight="400">can't be reached it says so and uses the snapshots already in the folder</text><line x1="380" y1="222" x2="380" y2="246" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="248" width="224" height="82" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="36" y="270" font-size="13" fill="#2f5bd3" font-weight="700">Handoff note</text><text x="36" y="290" font-size="13" fill="#17202e" font-weight="400">the agent's summary,</text><text x="36" y="308" font-size="13" fill="#17202e" font-weight="400">handoff-&lt;branch&gt;.md</text><rect x="268" y="248" width="224" height="82" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="280" y="270" font-size="13" fill="#2f5bd3" font-weight="700">Facts</text><text x="280" y="290" font-size="13" fill="#17202e" font-weight="400">from the newest snapshot</text><text x="280" y="308" font-size="13" fill="#17202e" font-weight="400">for this branch</text><rect x="512" y="248" width="224" height="82" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="524" y="270" font-size="13" fill="#2f5bd3" font-weight="700">Behind check</text><text x="524" y="290" font-size="13" fill="#17202e" font-weight="400">this folder is N commits</text><text x="524" y="308" font-size="13" fill="#17202e" font-weight="400">behind GitHub</text><line x1="380" y1="330" x2="380" y2="362" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="364" width="712" height="122" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="36" y="386" font-size="13" fill="#2f5bd3" font-weight="700">3. Compare each file the snapshot changed with the folder</text><rect x="40" y="402" width="210" height="72" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="424" font-size="13" fill="#1f7a4d" font-weight="700">Same</text><text x="52" y="444" font-size="13" fill="#17202e" font-weight="400">already the same:</text><text x="52" y="462" font-size="13" fill="#17202e" font-weight="400">nothing to do</text><rect x="266" y="402" width="220" height="72" rx="10" fill="#fdeed9" stroke="#b35f00" stroke-width="1.5"/><text x="278" y="424" font-size="13" fill="#b35f00" font-weight="700">Only in the snapshot</text><text x="278" y="444" font-size="13" fill="#17202e" font-weight="400">listed with the restore</text><text x="278" y="462" font-size="13" fill="#17202e" font-weight="400">command; asks you first</text><rect x="502" y="402" width="218" height="72" rx="10" fill="#fbe1e3" stroke="#b4232f" stroke-width="1.5"/><text x="514" y="424" font-size="13" fill="#b4232f" font-weight="700">Changed in both</text><text x="514" y="444" font-size="13" fill="#17202e" font-weight="400">listed as a conflict;</text><text x="514" y="462" font-size="13" fill="#17202e" font-weight="400">never overwritten</text><line x1="380" y1="486" x2="380" y2="516" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="518" width="712" height="64" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="36" y="540" font-size="13" fill="#1f7a4d" font-weight="700">4. Shown at the top of the session</text><text x="36" y="560" font-size="13" fill="#17202e" font-weight="400">one block, capped in length (a cut is named); other branches saved in the last day get one line</text></svg>
