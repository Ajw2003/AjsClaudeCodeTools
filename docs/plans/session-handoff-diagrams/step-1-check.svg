<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="system-ui,Segoe UI,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566174"/></marker></defs><rect x="0" y="0" width="760" height="520" rx="16" fill="#ffffff"/><text x="24" y="36" font-size="19" fill="#17202e" font-weight="700">End-of-reply check: is this turn's work saved and described?</text><rect x="24" y="56" width="220" height="72" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="36" y="78" font-size="13" fill="#566174" font-weight="700">1. The turn ends</text><text x="36" y="98" font-size="13" fill="#17202e" font-weight="400">the agent finishes</text><text x="36" y="116" font-size="13" fill="#17202e" font-weight="400">its reply</text><line x1="244" y1="87" x2="288" y2="87" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="290" y="56" width="220" height="72" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="302" y="78" font-size="13" fill="#2f5bd3" font-weight="700">2. Did it change anything?</text><text x="302" y="98" font-size="13" fill="#17202e" font-weight="400">any file written</text><text x="302" y="116" font-size="13" fill="#17202e" font-weight="400">or commit made?</text><line x1="510" y1="87" x2="554" y2="87" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><text x="516" y="83" font-size="12" fill="#566174" font-weight="700">no</text><rect x="556" y="56" width="180" height="72" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="568" y="78" font-size="13" fill="#566174" font-weight="700">Silent</text><text x="568" y="98" font-size="13" fill="#17202e" font-weight="400">no check,</text><text x="568" y="116" font-size="13" fill="#17202e" font-weight="400">reply goes out</text><line x1="400" y1="126" x2="400" y2="156" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><text x="408" y="145" font-size="12" fill="#566174" font-weight="700">yes</text><rect x="24" y="158" width="712" height="222" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="36" y="180" font-size="13" fill="#2f5bd3" font-weight="700">3. Five checks; each says yes, no, or "could not tell" (never a silent pass)</text><rect x="40" y="196" width="160" height="30" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="216" font-size="13" fill="#1f7a4d" font-weight="700">Committed</text><text x="214" y="216" font-size="13" fill="#17202e" font-weight="400">every file the turn wrote is in a commit</text><rect x="40" y="232" width="160" height="30" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="252" font-size="13" fill="#1f7a4d" font-weight="700">Pushed</text><text x="214" y="252" font-size="13" fill="#17202e" font-weight="400">the branch is on GitHub, nothing left to push (on main: branch off first)</text><rect x="40" y="268" width="160" height="30" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="288" font-size="13" fill="#1f7a4d" font-weight="700">Note is current</text><text x="214" y="288" font-size="13" fill="#17202e" font-weight="400">docs/5-today/handoff-&lt;branch&gt;.md is not older than the newest commit</text><rect x="40" y="304" width="160" height="30" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="324" font-size="13" fill="#1f7a4d" font-weight="700">Note is clean</text><text x="214" y="324" font-size="13" fill="#17202e" font-weight="400">no published page link, no session link, no Claude credit</text><rect x="40" y="340" width="160" height="30" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="360" font-size="13" fill="#1f7a4d" font-weight="700">Today.md updated</text><text x="214" y="360" font-size="13" fill="#17202e" font-weight="400">the turn changed files, so docs/5-today/Today.md changed too</text><line x1="200" y1="380" x2="200" y2="420" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><text x="208" y="404" font-size="12" fill="#566174" font-weight="700">all yes</text><line x1="560" y1="380" x2="560" y2="420" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><text x="568" y="404" font-size="12" fill="#566174" font-weight="700">any no</text><rect x="24" y="422" width="360" height="80" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="36" y="444" font-size="13" fill="#1f7a4d" font-weight="700">Passes</text><text x="36" y="464" font-size="13" fill="#17202e" font-weight="400">the reply goes out as written</text><rect x="400" y="422" width="336" height="80" rx="10" fill="#fbe1e3" stroke="#b4232f" stroke-width="1.5"/><text x="412" y="444" font-size="13" fill="#b4232f" font-weight="700">Sent back once</text><text x="412" y="464" font-size="13" fill="#17202e" font-weight="400">the reply comes back once with the exact fix;</text><text x="412" y="482" font-size="13" fill="#17202e" font-weight="400">the retry only reports, so it never loops</text></svg>
