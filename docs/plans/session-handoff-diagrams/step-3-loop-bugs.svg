<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui,Segoe UI,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566174"/></marker></defs><rect x="0" y="0" width="760" height="400" rx="16" fill="#ffffff"/><text x="24" y="36" font-size="19" fill="#17202e" font-weight="700">Design-loop bugs from October: check what main already fixed</text><rect x="24" y="56" width="712" height="150" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="36" y="78" font-size="13" fill="#566174" font-weight="700">Bug 1: the feature name swallowed message markup</text><rect x="40" y="96" width="330" height="92" rx="10" fill="#fbe1e3" stroke="#b4232f" stroke-width="1.5"/><text x="52" y="118" font-size="13" fill="#b4232f" font-weight="700">Prompt in a project thread</text><text x="52" y="138" font-size="13" fill="#17202e" font-weight="400">Design approved: usage limit</text><text x="52" y="156" font-size="13" fill="#17202e" font-weight="400">handoff 1A 2A 3A&lt;/message&gt;</text><line x1="370" y1="142" x2="410" y2="142" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="412" y="96" width="308" height="92" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="424" y="118" font-size="13" fill="#1f7a4d" font-weight="700">Name saved now</text><text x="424" y="138" font-size="13" fill="#17202e" font-weight="400">"usage limit handoff": already</text><text x="424" y="156" font-size="13" fill="#17202e" font-weight="400">fixed on main by #403, with a</text><text x="424" y="174" font-size="13" fill="#17202e" font-weight="400">verify.py check</text><rect x="24" y="222" width="712" height="160" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="36" y="244" font-size="13" fill="#566174" font-weight="700">Bug 2: a quoted message from another thread moved this thread's stage</text><rect x="40" y="262" width="330" height="100" rx="10" fill="#fbe1e3" stroke="#b4232f" stroke-width="1.5"/><text x="52" y="284" font-size="13" fill="#b4232f" font-weight="700">Quoted text</text><text x="52" y="304" font-size="13" fill="#17202e" font-weight="400">&gt; "Design approved:</text><text x="52" y="322" font-size="13" fill="#17202e" font-weight="400">background work tracking 1*"</text><text x="52" y="340" font-size="13" fill="#17202e" font-weight="400">(passed along, not typed here)</text><line x1="370" y1="312" x2="410" y2="312" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="412" y="262" width="308" height="108" rx="10" fill="#fdeed9" stroke="#b35f00" stroke-width="1.5"/><text x="424" y="284" font-size="13" fill="#b35f00" font-weight="700">Moves nothing (to confirm)</text><text x="424" y="304" font-size="13" fill="#17202e" font-weight="400">main skips quoted text and helper</text><text x="424" y="322" font-size="13" fill="#17202e" font-weight="400">messages, but no check replays</text><text x="424" y="340" font-size="13" fill="#17202e" font-weight="400">this case: add it, fix only if</text><text x="424" y="358" font-size="13" fill="#17202e" font-weight="400">it fails</text></svg>
