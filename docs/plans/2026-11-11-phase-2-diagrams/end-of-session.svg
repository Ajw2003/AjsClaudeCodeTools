<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="system-ui, sans-serif"><rect width="100%" height="100%" rx="12" fill="#fbfaf7"/><text x="20" y="34" font-size="12" font-weight="700" fill="#7d838c">At the end of a session</text><text x="170" y="34" font-size="12" font-weight="700" fill="#7d838c">Today</text><text x="520" y="34" font-size="12" font-weight="700" fill="#7d838c">After phase 2</text><rect x="14" y="50" width="852" height="46" rx="8" fill="#7d838c" fill-opacity="0.06"/><text x="24" y="78" font-size="13" font-weight="700" fill="#3f444b">Docs</text><text x="170" y="78" font-size="12" fill="#b5533c">A doc can cite code that changed or is gone</text><text x="520" y="78" font-size="12" fill="#2f7d5a">The commit that changes the code names the docs citing it</text><rect x="14" y="104" width="852" height="46" rx="8" fill="#7d838c" fill-opacity="0.06"/><text x="24" y="132" font-size="13" font-weight="700" fill="#3f444b">Changelog</text><text x="170" y="132" font-size="12" fill="#b5533c">No record of what changed, per repo</text><text x="520" y="132" font-size="12" fill="#2f7d5a">Each change gets a line in CHANGELOG.md</text><rect x="14" y="158" width="852" height="46" rx="8" fill="#7d838c" fill-opacity="0.06"/><text x="24" y="186" font-size="13" font-weight="700" fill="#3f444b">Branches</text><text x="170" y="186" font-size="12" fill="#b5533c">Merged branches pile up locally</text><text x="520" y="186" font-size="12" fill="#2f7d5a">A branch whose work is merged and on GitHub is deleted</text><rect x="14" y="212" width="852" height="46" rx="8" fill="#7d838c" fill-opacity="0.06"/><text x="24" y="240" font-size="13" font-weight="700" fill="#3f444b">Worktrees</text><text x="170" y="240" font-size="12" fill="#b5533c">Finished helper copies stay on disk</text><text x="520" y="240" font-size="12" fill="#2f7d5a">Clean, finished copies are removed; the disk use is reported</text><rect x="14" y="266" width="852" height="46" rx="8" fill="#7d838c" fill-opacity="0.06"/><text x="24" y="294" font-size="13" font-weight="700" fill="#3f444b">Big files</text><text x="170" y="294" font-size="12" fill="#b5533c">Nothing checks how a big file goes into git</text><text x="520" y="294" font-size="12" fill="#2f7d5a">Big files go through Git LFS; generated folders stay out</text></svg>