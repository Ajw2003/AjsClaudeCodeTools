<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 246"><rect width="100%" height="100%" rx="10" fill="#f6f5f1"/><text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7d838c">rules and verify.py, step 5 (#512)</text><text x="16" y="50" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ ## Values a person may tune are never hardcoded</text><text x="16" y="68" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ A value someone may want to change goes in a settings file or an exposed field, unless it was</text><text x="16" y="86" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ set by measurement. Check: harvest flags a new numeric literal assigned to a tuning-shaped name.</text><text x="16" y="104" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ ## A session finishes its own task</text><text x="16" y="122" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ Work for another repo becomes an issue in that repo; the session goes back to its task.</text><text x="16" y="140" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ Check: the end-of-turn check names a turn that edited files in a second repo.</text><text x="16" y="158" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve"></text><text x="16" y="176" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ # #228: every rule section names its check</text><text x="16" y="194" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ for section in _rule_sections(&quot;rules/house-rules.md&quot;):</text><text x="16" y="212" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     assert re.search(r&quot;\bCheck:|hook|verify\.py&quot;, section.body), section.title</text></svg>