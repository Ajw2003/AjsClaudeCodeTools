<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 282"><rect width="100%" height="100%" rx="10" fill="#f6f5f1"/><text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7d838c">docs.py, step 1 (#508)</text><text x="16" y="50" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve">  def _staged_docs_status(subject, elsewhere, root=None):</text><text x="16" y="68" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve">      effective = set(p.strip() for p in run_git([&quot;diff&quot;, &quot;--cached&quot;, &quot;--name-only&quot;]))</text><text x="16" y="86" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     citing = _docs_citing(root, effective)          # 1A: name each doc that cites a changed file</text><text x="16" y="104" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     if citing:</text><text x="16" y="122" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+         detail += &quot; These docs cite files this commit changes: %s.&quot; % &quot;, &quot;.join(citing)</text><text x="16" y="140" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+</text><text x="16" y="158" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ _CITE_RE = re.compile(r&quot;`?([\w./-]+\.(?:py|js|ts|cs|md|json|sh))(?::(\d+))?`?&quot;)</text><text x="16" y="176" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ def _docs_drift(root):</text><text x="16" y="194" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     &quot;&quot;&quot;Citations under docs/ to a file that is gone, or to a line past the end of the file.&quot;&quot;&quot;</text><text x="16" y="212" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     for doc, path, line in _citations(root):</text><text x="16" y="230" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+         if not os.path.isfile(path) or (line and line &gt; _line_count(path)):</text><text x="16" y="248" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+             yield doc, path, line</text></svg>