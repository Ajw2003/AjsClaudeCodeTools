<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 300"><rect width="100%" height="100%" rx="10" fill="#f6f5f1"/><text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7d838c">templates, docs.py, design_loop.py and safe_git.py, step 2 (#509)</text><text x="16" y="50" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ templates/CHANGELOG.md:  # Changelog / ## Unreleased / - adds 2 rules (+14 lines in rules/house-rules.md)</text><text x="16" y="68" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ DOCS_TIER_FILES.append(&quot;CHANGELOG.md&quot;)              # docstiers names a repo without one (#386)</text><text x="16" y="86" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve"></text><text x="16" y="104" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve">  CHECKPOINTS = [</text><text x="16" y="122" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve">      (&quot;reply ends&quot;, &quot;qa page&quot;, _check_qa_page, &quot;block&quot;),</text><text x="16" y="140" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     (&quot;reply ends&quot;, &quot;changelog&quot;, _check_changelog, &quot;block&quot;),   # 2A: wrote files, no new line</text><text x="16" y="158" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve">  ]</text><text x="16" y="176" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ def _check_changelog(ctx):</text><text x="16" y="194" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     if ctx[&quot;written_now&quot;] and &quot;CHANGELOG.md&quot; not in ctx[&quot;written_now&quot;]:</text><text x="16" y="212" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+         return &quot;files changed this turn and CHANGELOG.md has no new line under Unreleased&quot;</text><text x="16" y="230" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve"></text><text x="16" y="248" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ # #387: gh pr create / create_pull_request on a branch whose diff leaves CHANGELOG.md unchanged</text><text x="16" y="266" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ if not _branch_touches(top, &quot;CHANGELOG.md&quot;): notes.append(CHANGELOG_PR_NOTE)</text></svg>