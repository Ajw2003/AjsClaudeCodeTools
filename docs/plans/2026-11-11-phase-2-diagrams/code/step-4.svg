<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 318"><rect width="100%" height="100%" rx="10" fill="#f6f5f1"/><text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7d838c">docs.py, design_loop.py and core.py, step 4 (#511)</text><text x="16" y="50" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ BIG_FILE_BYTES = 50 * 1024 * 1024                    # a starting value, to be tuned</text><text x="16" y="68" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ REGENERATED = (&quot;Library/&quot;, &quot;Temp/&quot;, &quot;obj/&quot;, &quot;Builds/&quot;, &quot;node_modules/&quot;)</text><text x="16" y="86" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ for path in effective:</text><text x="16" y="104" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     if _size(path) &gt; BIG_FILE_BYTES and path not in state.get(&quot;lfs_approved&quot;, []):</text><text x="16" y="122" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+         return refuse(&quot;%s is %d MB; add it to .gitignore, or aj writes &#x27;LFS approved: %s&#x27;&quot; % ...)</text><text x="16" y="140" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     if path.startswith(REGENERATED) and not _ignored(path): return refuse(...)</text><text x="16" y="158" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve"></text><text x="16" y="176" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ # aj&#x27;s own message, one file at a time (4A)</text><text x="16" y="194" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ _LFS_APPROVED_RE = re.compile(r&quot;(?mi)^\s*LFS approved:\s*(\S+)\s*$&quot;)</text><text x="16" y="212" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ used, how = _lfs_used(top)       # billing API; in a cloud session: this repo&#x27;s LFS files, and say so</text><text x="16" y="230" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ if used + _size(path) &gt; LFS_FREE_BYTES: note = &quot;would pass the free 10 GiB: %s used + %s&quot; % ...</text><text x="16" y="248" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ else: state.setdefault(&quot;lfs_approved&quot;, []).append(path)   # then: git lfs track, add, commit</text><text x="16" y="266" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve"></text><text x="16" y="284" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ # session start: name helper worktrees and generated folders over 5 GB (a starting value)</text></svg>