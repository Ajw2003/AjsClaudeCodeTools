<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 282"><rect width="100%" height="100%" rx="10" fill="#f6f5f1"/><text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7d838c">design_loop.py and delegation.py, step 3 (#510)</text><text x="16" y="50" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve">  def event_closablemerge():</text><text x="16" y="68" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve">      merged = _closable_merge_of(data)</text><text x="16" y="86" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     cleaned, kept = _cleanup_after_merge(top, merged)     # 3A</text><text x="16" y="104" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     notes.append(&quot;Deleted after the merge: %s. Kept: %s.&quot; % (cleaned, kept))</text><text x="16" y="122" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2b2f35" xml:space="preserve"></text><text x="16" y="140" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+ def _cleanup_after_merge(top, merged):</text><text x="16" y="158" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     for branch in _local_branches(top):</text><text x="16" y="176" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+         if _all_commits_on(top, branch, &quot;origin/&quot; + default) and not _unpushed(top, branch):</text><text x="16" y="194" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+             _ag(top, [&quot;branch&quot;, &quot;-d&quot;, branch])            # -d, never -D: git refuses unmerged work</text><text x="16" y="212" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+     for wt in _worktrees(top):</text><text x="16" y="230" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+         if _clean(wt) and not _unpushed(wt, wt.branch):</text><text x="16" y="248" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#2f7d5a" xml:space="preserve">+             _ag(top, [&quot;worktree&quot;, &quot;remove&quot;, wt.path])     # never --force</text></svg>