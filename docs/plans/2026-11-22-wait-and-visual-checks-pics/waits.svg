<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="A wait with a clock: first check at 1 minute, then every minute, ending at done, stalled or deadline">
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#17202e}.l{stroke:#566174;stroke-width:2}.d{fill:#2f5bd3}.g{fill:#1f7a4d}.r{fill:#b4232f}.b{fill:#e3eafc}</style>
<rect width="640" height="220" class="b"/>
<line x1="40" y1="110" x2="600" y2="110" class="l"/>
<circle cx="40" cy="110" r="9" class="d"/><text x="20" y="145">start</text><text x="14" y="165">say the goal</text>
<circle cx="150" cy="110" r="7" class="d"/><text x="128" y="90">1 min</text><text x="112" y="145">first check</text>
<circle cx="260" cy="110" r="7" class="d"/><text x="238" y="90">2 min</text>
<circle cx="370" cy="110" r="7" class="d"/><text x="348" y="90">3 min</text>
<text x="415" y="110" dx="0">...every minute</text>
<circle cx="600" cy="110" r="9" class="r"/><text x="520" y="145">deadline:</text><text x="505" y="165">stop, report, go on</text>
<text x="40" y="40">Each check has one of three answers: done, still moving, or stalled.</text>
<text x="40" y="62">Stalled or past the deadline ends the wait; it never waits for ever.</text>
</svg>
