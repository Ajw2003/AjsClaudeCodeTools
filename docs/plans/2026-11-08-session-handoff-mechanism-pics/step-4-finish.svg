<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="system-ui,Segoe UI,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566174"/></marker></defs><rect x="0" y="0" width="760" height="440" rx="16" fill="#ffffff"/><text x="24" y="36" font-size="19" fill="#17202e" font-weight="700">Finish: rules, docs, tests, and a real run on two accounts</text><rect x="24" y="56" width="168" height="82" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="36" y="78" font-size="13" fill="#2f5bd3" font-weight="700">Rule text</text><text x="36" y="98" font-size="13" fill="#17202e" font-weight="400">house-rules.md names</text><text x="36" y="116" font-size="13" fill="#17202e" font-weight="400">the save and pickup</text><rect x="204" y="56" width="168" height="82" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="216" y="78" font-size="13" fill="#2f5bd3" font-weight="700">Docs</text><text x="216" y="98" font-size="13" fill="#17202e" font-weight="400">Today.md, ProjectState.md,</text><text x="216" y="116" font-size="13" fill="#17202e" font-weight="400">usage-handoff.md</text><rect x="384" y="56" width="168" height="82" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="396" y="78" font-size="13" fill="#2f5bd3" font-weight="700">Tests</text><text x="396" y="98" font-size="13" fill="#17202e" font-weight="400">verify.py cases for</text><text x="396" y="116" font-size="13" fill="#17202e" font-weight="400">every step, run twice</text><rect x="564" y="56" width="168" height="82" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="576" y="78" font-size="13" fill="#2f5bd3" font-weight="700">Version</text><text x="576" y="98" font-size="13" fill="#17202e" font-weight="400">plugin version bumped</text><text x="576" y="116" font-size="13" fill="#17202e" font-weight="400">so installs update</text><rect x="24" y="160" width="712" height="262" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="36" y="182" font-size="13" fill="#566174" font-weight="700">The real run that proves it</text><rect x="40" y="198" width="120" height="34" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="52" y="220" font-size="13" fill="#2f5bd3" font-weight="700">Account 1</text><text x="176" y="220" font-size="13" fill="#17202e" font-weight="400">edits a file in a session, then the session is stopped mid-turn</text><line x1="100" y1="232" x2="100" y2="242" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="242" width="120" height="34" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="264" font-size="13" fill="#1f7a4d" font-weight="700">GitHub</text><text x="176" y="264" font-size="13" fill="#17202e" font-weight="400">git ls-remote shows refs/house-rules/autosave/&lt;branch&gt;</text><line x1="100" y1="276" x2="100" y2="286" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="286" width="120" height="34" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="52" y="308" font-size="13" fill="#2f5bd3" font-weight="700">Account 2</text><text x="176" y="308" font-size="13" fill="#17202e" font-weight="400">opens a fresh clone in a new folder and starts a session</text><line x1="100" y1="320" x2="100" y2="330" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="330" width="120" height="34" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="52" y="352" font-size="13" fill="#1f7a4d" font-weight="700">Pickup</text><text x="176" y="352" font-size="13" fill="#17202e" font-weight="400">shows the note, the facts and the file that is missing</text><line x1="100" y1="364" x2="100" y2="374" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="374" width="120" height="34" rx="10" fill="#fdeed9" stroke="#b35f00" stroke-width="1.5"/><text x="52" y="396" font-size="13" fill="#b35f00" font-weight="700">aj</text><text x="176" y="396" font-size="13" fill="#17202e" font-weight="400">says yes; the file is restored and the work continues</text></svg>
