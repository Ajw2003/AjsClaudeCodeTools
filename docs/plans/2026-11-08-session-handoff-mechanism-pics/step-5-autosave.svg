<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="system-ui,Segoe UI,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566174"/></marker></defs><rect x="0" y="0" width="760" height="560" rx="16" fill="#ffffff"/><text x="24" y="36" font-size="19" fill="#17202e" font-weight="700">Automatic save: after every edit, on every branch</text><rect x="24" y="56" width="200" height="72" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="36" y="78" font-size="13" fill="#566174" font-weight="700">1. The agent edits</text><text x="36" y="98" font-size="13" fill="#17202e" font-weight="400">Write, Edit or Bash call</text><text x="36" y="116" font-size="13" fill="#17202e" font-weight="400">in the main session</text><line x1="224" y1="87" x2="268" y2="87" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="56" width="210" height="72" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="282" y="78" font-size="13" fill="#2f5bd3" font-weight="700">2. Saved under 60 s ago?</text><text x="282" y="98" font-size="13" fill="#17202e" font-weight="400">reads one small file;</text><text x="282" y="116" font-size="13" fill="#17202e" font-weight="400">no git process yet</text><line x1="480" y1="87" x2="524" y2="87" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><text x="486" y="83" font-size="12" fill="#566174" font-weight="700">yes</text><rect x="526" y="56" width="210" height="72" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="538" y="78" font-size="13" fill="#566174" font-weight="700">Wait</text><text x="538" y="98" font-size="13" fill="#17202e" font-weight="400">remember the file name,</text><text x="538" y="116" font-size="13" fill="#17202e" font-weight="400">stop until the next edit</text><line x1="375" y1="126" x2="375" y2="160" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><text x="383" y="147" font-size="12" fill="#566174" font-weight="700">no</text><rect x="24" y="162" width="712" height="150" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="36" y="184" font-size="13" fill="#2f5bd3" font-weight="700">3. Build a snapshot in a temporary index (your own staging area is not used)</text><rect x="40" y="200" width="160" height="92" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="52" y="222" font-size="13" fill="#566174" font-weight="700">Start</text><text x="52" y="242" font-size="13" fill="#17202e" font-weight="400">a copy of the last</text><text x="52" y="260" font-size="13" fill="#17202e" font-weight="400">commit (HEAD)</text><line x1="200" y1="246" x2="214" y2="246" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="216" y="200" width="160" height="92" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="228" y="222" font-size="13" fill="#566174" font-weight="700">Add changes</text><text x="228" y="242" font-size="13" fill="#17202e" font-weight="400">to files git</text><text x="228" y="260" font-size="13" fill="#17202e" font-weight="400">already tracks</text><line x1="376" y1="246" x2="390" y2="246" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="392" y="200" width="160" height="92" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="404" y="222" font-size="13" fill="#566174" font-weight="700">Add new files</text><text x="404" y="242" font-size="13" fill="#17202e" font-weight="400">only ones the agent</text><text x="404" y="260" font-size="13" fill="#17202e" font-weight="400">wrote (rule from #477)</text><line x1="552" y1="246" x2="566" y2="246" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="568" y="200" width="160" height="92" rx="10" fill="#f1f3f7" stroke="#566174" stroke-width="1.5"/><text x="580" y="222" font-size="13" fill="#566174" font-weight="700">Add facts</text><text x="580" y="242" font-size="13" fill="#17202e" font-weight="400">.house-rules/</text><text x="580" y="260" font-size="13" fill="#17202e" font-weight="400">handoff-facts.md</text><line x1="375" y1="312" x2="375" y2="350" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="352" width="340" height="80" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="36" y="374" font-size="13" fill="#1f7a4d" font-weight="700">4. Save the snapshot</text><text x="36" y="394" font-size="13" fill="#17202e" font-weight="400">a commit no branch points at, kept</text><text x="36" y="412" font-size="13" fill="#17202e" font-weight="400">at refs/house-rules/autosave/&lt;branch&gt;</text><line x1="364" y1="392" x2="410" y2="392" stroke="#566174" stroke-width="2" marker-end="url(#a)"/><rect x="412" y="352" width="324" height="80" rx="10" fill="#dff3e8" stroke="#1f7a4d" stroke-width="1.5"/><text x="424" y="374" font-size="13" fill="#1f7a4d" font-weight="700">5. Send it to GitHub</text><text x="424" y="394" font-size="13" fill="#17202e" font-weight="400">push that one ref, 6 s timeout;</text><text x="424" y="412" font-size="13" fill="#17202e" font-weight="400">a failure is said in one line</text><rect x="24" y="452" width="340" height="90" rx="10" fill="#fdeed9" stroke="#b35f00" stroke-width="1.5"/><text x="36" y="474" font-size="13" fill="#b35f00" font-weight="700">Never changed</text><text x="36" y="494" font-size="13" fill="#17202e" font-weight="400">your branch and its history</text><text x="36" y="512" font-size="13" fill="#17202e" font-weight="400">your staging area</text><text x="36" y="530" font-size="13" fill="#17202e" font-weight="400">the files in your folder</text><rect x="412" y="452" width="324" height="90" rx="10" fill="#e3eafc" stroke="#2f5bd3" stroke-width="1.5"/><text x="424" y="474" font-size="13" fill="#2f5bd3" font-weight="700">Also saves</text><text x="424" y="494" font-size="13" fill="#17202e" font-weight="400">a turn ending (Stop), and a turn cut off</text><text x="424" y="512" font-size="13" fill="#17202e" font-weight="400">by a usage limit (StopFailure),</text><text x="424" y="530" font-size="13" fill="#17202e" font-weight="400">save at once, skipping the 60 s wait</text></svg>
