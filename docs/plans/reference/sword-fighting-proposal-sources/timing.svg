<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Trebuchet MS,Verdana,sans-serif">
<rect width="960" height="400" fill="#f4f7fb"/>
<text x="30" y="44" font-size="26" font-weight="bold" fill="#1d2b3a">One NPC attack, beat by beat</text>
<text x="30" y="70" font-size="15" fill="#46566a">Times are proposed starting values, not tested. Difficulty only stretches or squeezes these bars.</text>
<g font-size="13">
 <text x="30" y="132" font-weight="bold" fill="#1d2b3a">Training Post</text>
 <rect x="180" y="112" width="420" height="30" fill="#f0c674"/><text x="190" y="132" fill="#1d2b3a">Telegraph 1.2 s: wind-up and blade glint</text>
 <rect x="600" y="112" width="88" height="30" fill="#ffb347"/><text x="606" y="132" fill="#1d2b3a">Parry 250 ms</text>
 <rect x="688" y="112" width="6" height="30" fill="#c8321e"/>
 <rect x="694" y="112" width="230" height="30" fill="#8fd18f"/><text x="700" y="132" fill="#1d2b3a">Your free swing 1.0 s</text>

 <text x="30" y="192" font-weight="bold" fill="#1d2b3a">Lumberjack Lou</text>
 <rect x="180" y="172" width="315" height="30" fill="#f0c674"/><text x="190" y="192" fill="#1d2b3a">Telegraph 0.9 s</text>
 <rect x="495" y="172" width="70" height="30" fill="#ffb347"/><text x="499" y="192" fill="#1d2b3a">200 ms</text>
 <rect x="565" y="172" width="6" height="30" fill="#c8321e"/>
 <rect x="571" y="172" width="160" height="30" fill="#8fd18f"/><text x="577" y="192" fill="#1d2b3a">0.7 s</text>

 <text x="30" y="252" font-weight="bold" fill="#1d2b3a">Old Man Winter</text>
 <rect x="180" y="232" width="175" height="30" fill="#f0c674"/><text x="190" y="252" fill="#1d2b3a">0.5 s</text>
 <rect x="355" y="232" width="42" height="30" fill="#ffb347"/><text x="357" y="252" fill="#1d2b3a">120</text>
 <rect x="397" y="232" width="6" height="30" fill="#c8321e"/>
 <rect x="403" y="232" width="105" height="30" fill="#8fd18f"/><text x="409" y="252" fill="#1d2b3a">0.4 s</text>
 <rect x="508" y="232" width="175" height="30" fill="#f0c674" opacity=".55"/><text x="514" y="252" fill="#1d2b3a">then a combo follow-up</text>
</g>
<g font-size="13" fill="#1d2b3a">
 <rect x="180" y="300" width="18" height="18" fill="#f0c674"/><text x="204" y="314">Block any time in here</text>
 <rect x="380" y="300" width="18" height="18" fill="#ffb347"/><text x="404" y="314">Block here = parry</text>
 <rect x="560" y="300" width="6" height="18" fill="#c8321e"/><text x="574" y="314">Impact: unblocked = a hit</text>
 <rect x="760" y="300" width="18" height="18" fill="#8fd18f"/><text x="784" y="314">Counter window</text>
 <text x="180" y="356" fill="#46566a">Hidden from you: a fixed network allowance is added to every window once P0 measures the real delay.</text>
</g>
</svg>
