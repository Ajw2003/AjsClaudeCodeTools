<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" role="img"><title>A lesson outline: the gist and New words first are stable; the other six parts are drafts</title><defs><style>
svg{--bg:#f6f8f7;--card:#ffffff;--ink:#1f2a29;--soft:#55625f;--rule:#cfd9d5;--tone:#2c6684;--tint:#e3eef3;--ok:#2f7a4d;--oktint:#e2f1e7;--draft:#9a6a12;--drafttint:#f7eedb}
@media (prefers-color-scheme: dark){svg{--bg:#161c1c;--card:#1e2726;--ink:#e2ebe8;--soft:#a9b8b4;--rule:#3a4846;--tone:#8cc3dd;--tint:#1f3440;--ok:#7fd1a0;--oktint:#1d3326;--draft:#f0c070;--drafttint:#3a2f1a}}
text{font-family:Verdana,Tahoma,sans-serif;fill:var(--ink);font-size:14px}
.bg{fill:var(--bg)} .h{font-size:16px;font-weight:700} .s{fill:var(--soft);font-size:13px} .m{font-family:Consolas,Menlo,monospace;font-size:13.5px}
.card{fill:var(--card);stroke:var(--rule);stroke-width:1.5} .strong{fill:var(--tint);stroke:var(--tone);stroke-width:2}
.ok{fill:var(--oktint);stroke:var(--ok);stroke-width:2} .draft{fill:var(--drafttint);stroke:var(--draft);stroke-width:2;stroke-dasharray:6 4}
.okt{fill:var(--ok);font-weight:700} .draftt{fill:var(--draft);font-weight:700} .tone{fill:var(--tone)} .tonet{fill:var(--tone);font-weight:700}
.line{stroke:var(--tone);stroke-width:2;fill:none} .rule{stroke:var(--rule);stroke-width:1.5;fill:none} .dash{stroke:var(--tone);stroke-width:2;fill:none;stroke-dasharray:6 5}
.dot{fill:var(--tone)} .dott{fill:var(--card);font-size:13px;font-weight:700}
</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tone"/></marker></defs><rect class="bg" width="680" height="412" rx="10"/><text x="24" y="34" class="h">Which parts of a lesson are frozen</text><rect x="420" y="20" width="18" height="18" rx="4" class="ok"/><text x="446" y="34">Stable: follow exactly</text><rect x="420" y="46" width="18" height="18" rx="4" class="draft"/><text x="446" y="60">Draft: best guess so far</text><rect x="24" y="84" width="360" height="32" rx="7" class="ok"/><text x="40" y="105">The gist</text><text x="370" y="105" text-anchor="end" class="okt">stable</text><rect x="24" y="124" width="360" height="32" rx="7" class="draft"/><text x="40" y="145">1  Why you care</text><text x="370" y="145" text-anchor="end" class="draftt">draft</text><rect x="24" y="164" width="360" height="32" rx="7" class="ok"/><text x="40" y="185">2  New words first</text><text x="370" y="185" text-anchor="end" class="okt">stable</text><rect x="24" y="204" width="360" height="32" rx="7" class="draft"/><text x="40" y="225">3  Think of it like this</text><text x="370" y="225" text-anchor="end" class="draftt">draft</text><rect x="24" y="244" width="360" height="32" rx="7" class="draft"/><text x="40" y="265">4  The core idea</text><text x="370" y="265" text-anchor="end" class="draftt">draft</text><rect x="24" y="284" width="360" height="32" rx="7" class="draft"/><text x="40" y="305">5  Picture it</text><text x="370" y="305" text-anchor="end" class="draftt">draft</text><rect x="24" y="324" width="360" height="32" rx="7" class="draft"/><text x="40" y="345">6  Where it is used</text><text x="370" y="345" text-anchor="end" class="draftt">draft</text><rect x="24" y="364" width="360" height="32" rx="7" class="draft"/><text x="40" y="385">7  Check yourself</text><text x="370" y="385" text-anchor="end" class="draftt">draft</text><text x="420" y="130" class="s">The two parts you</text><text x="420" y="148" class="s">called mature: the gist</text><text x="420" y="166" class="s">and New words first,</text><text x="420" y="184" class="s">with Other meanings.</text><text x="420" y="222" class="s">Fixing a draft part can</text><text x="420" y="240" class="s">never change a part you</text><text x="420" y="258" class="s">already approved.</text></svg>