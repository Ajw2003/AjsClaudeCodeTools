<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" role="img"><title>The five steps of /learn, with a loop back from checking to rewriting</title><defs><style>
svg{--bg:#f6f8f7;--card:#ffffff;--ink:#1f2a29;--soft:#55625f;--rule:#cfd9d5;--tone:#2c6684;--tint:#e3eef3;--ok:#2f7a4d;--oktint:#e2f1e7;--draft:#9a6a12;--drafttint:#f7eedb}
@media (prefers-color-scheme: dark){svg{--bg:#161c1c;--card:#1e2726;--ink:#e2ebe8;--soft:#a9b8b4;--rule:#3a4846;--tone:#8cc3dd;--tint:#1f3440;--ok:#7fd1a0;--oktint:#1d3326;--draft:#f0c070;--drafttint:#3a2f1a}}
text{font-family:Verdana,Tahoma,sans-serif;fill:var(--ink);font-size:14px}
.bg{fill:var(--bg)} .h{font-size:16px;font-weight:700} .s{fill:var(--soft);font-size:13px} .m{font-family:Consolas,Menlo,monospace;font-size:13.5px}
.card{fill:var(--card);stroke:var(--rule);stroke-width:1.5} .strong{fill:var(--tint);stroke:var(--tone);stroke-width:2}
.ok{fill:var(--oktint);stroke:var(--ok);stroke-width:2} .draft{fill:var(--drafttint);stroke:var(--draft);stroke-width:2;stroke-dasharray:6 4}
.okt{fill:var(--ok);font-weight:700} .draftt{fill:var(--draft);font-weight:700} .tone{fill:var(--tone)} .tonet{fill:var(--tone);font-weight:700}
.line{stroke:var(--tone);stroke-width:2;fill:none} .rule{stroke:var(--rule);stroke-width:1.5;fill:none} .dash{stroke:var(--tone);stroke-width:2;fill:none;stroke-dasharray:6 5}
.dot{fill:var(--tone)} .dott{fill:var(--card);font-size:13px;font-weight:700}
</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tone"/></marker></defs><rect class="bg" width="680" height="266" rx="10"/><text x="24" y="34" class="h">What happens when you type /learn next</text><rect x="24" y="64" width="112" height="78" rx="9" class="card"/><circle cx="44" cy="84" r="11" class="dot"/><text x="44" y="89" text-anchor="middle" class="dott">1</text><text x="80" y="114" text-anchor="middle">Get the</text><text x="80" y="132" text-anchor="middle">source page</text><rect x="156" y="64" width="112" height="78" rx="9" class="card"/><circle cx="176" cy="84" r="11" class="dot"/><text x="176" y="89" text-anchor="middle" class="dott">2</text><text x="212" y="114" text-anchor="middle">Write the</text><text x="212" y="132" text-anchor="middle">lesson</text><rect x="288" y="64" width="112" height="78" rx="9" class="strong"/><circle cx="308" cy="84" r="11" class="dot"/><text x="308" y="89" text-anchor="middle" class="dott">3</text><text x="344" y="114" text-anchor="middle">Check each</text><text x="344" y="132" text-anchor="middle">claim</text><rect x="420" y="64" width="112" height="78" rx="9" class="card"/><circle cx="440" cy="84" r="11" class="dot"/><text x="440" y="89" text-anchor="middle" class="dott">4</text><text x="476" y="114" text-anchor="middle">Build the</text><text x="476" y="132" text-anchor="middle">page</text><rect x="552" y="64" width="112" height="78" rx="9" class="card"/><circle cx="572" cy="84" r="11" class="dot"/><text x="572" y="89" text-anchor="middle" class="dott">5</text><text x="608" y="114" text-anchor="middle">Save it</text><text x="608" y="132" text-anchor="middle">and show you</text><path class="line" d="M138 103H154" marker-end="url(#a)"/><path class="line" d="M270 103H286" marker-end="url(#a)"/><path class="line" d="M402 103H418" marker-end="url(#a)"/><path class="line" d="M534 103H550" marker-end="url(#a)"/><path class="dash" d="M344 144V176H212V146" marker-end="url(#a)"/><text x="278.0" y="198" text-anchor="middle" class="s">A claim fails? Rewrite it, then check again.</text><text x="344" y="226" text-anchor="middle" class="s">Step 3 is a separate agent, so the lesson never checks itself.</text><text x="344" y="246" text-anchor="middle" class="s">You never read the source.</text></svg>