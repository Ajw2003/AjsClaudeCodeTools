.dot{fill:var(--tone)} .dott{fill:var(--card);font-size:13px;font-weight:700}
</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tone"/></marker></defs><rect class="bg" width="680" height="290" rx="10"/><text x="24" y="34" class="h">/learn next knows where you are</text><rect x="24" y="60" width="380" height="30" rx="7" class="ok"/><text x="44" y="80">Basics</text><path d="M370 75l6 6l12-12" stroke="var(--ok)" stroke-width="3" fill="none"/><rect x="24" y="98" width="380" height="30" rx="7" class="strong"/><text x="44" y="118">High Level Design intro</text><path class="line" d="M480 113H414" marker-end="url(#a)"/><text x="490" y="118" class="tonet">next lesson</text><rect x="24" y="136" width="380" height="30" rx="7" class="card"/><text x="44" y="156">Architectural styles</text><rect x="24" y="174" width="380" height="30" rx="7" class="card"/><text x="44" y="194">Scalability</text><rect x="24" y="212" width="380" height="30" rx="7" class="card"/><text x="44" y="232">Databases</text><rect x="24" y="250" width="380" height="30" rx="7" class="card"/><text x="44" y="270">...14 more modules</text><text x="440" y="200" class="s">Saved in your lessons</text><text x="440" y="218" class="s">folder as course.json,</text><text x="440" y="236" class="s">in the tutorial's order.</text></svg>