<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" role="img"><title>Six documentation tiers from landing to decisions; the roadmap holds the open-source app</title><defs><style>
svg{--bg:#f6f8f7;--card:#ffffff;--ink:#1f2a29;--soft:#55625f;--rule:#cfd9d5;--tone:#2c6684;--tint:#e3eef3;--ok:#2f7a4d;--oktint:#e2f1e7;--draft:#9a6a12;--drafttint:#f7eedb}
@media (prefers-color-scheme: dark){svg{--bg:#161c1c;--card:#1e2726;--ink:#e2ebe8;--soft:#a9b8b4;--rule:#3a4846;--tone:#8cc3dd;--tint:#1f3440;--ok:#7fd1a0;--oktint:#1d3326;--draft:#f0c070;--drafttint:#3a2f1a}}
text{font-family:Verdana,Tahoma,sans-serif;fill:var(--ink);font-size:14px}
.bg{fill:var(--bg)} .h{font-size:16px;font-weight:700} .s{fill:var(--soft);font-size:13px} .m{font-family:Consolas,Menlo,monospace;font-size:13.5px}
.card{fill:var(--card);stroke:var(--rule);stroke-width:1.5} .strong{fill:var(--tint);stroke:var(--tone);stroke-width:2}
.ok{fill:var(--oktint);stroke:var(--ok);stroke-width:2} .draft{fill:var(--drafttint);stroke:var(--draft);stroke-width:2;stroke-dasharray:6 4}
.okt{fill:var(--ok);font-weight:700} .draftt{fill:var(--draft);font-weight:700} .tone{fill:var(--tone)} .tonet{fill:var(--tone);font-weight:700}
.line{stroke:var(--tone);stroke-width:2;fill:none} .rule{stroke:var(--rule);stroke-width:1.5;fill:none} .dash{stroke:var(--tone);stroke-width:2;fill:none;stroke-dasharray:6 5}
.dot{fill:var(--tone)} .dott{fill:var(--card);font-size:13px;font-weight:700}
</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tone"/></marker></defs><rect class="bg" width="680" height="306" rx="10"/><text x="24" y="34" class="h">The repo's six documentation tiers</text><rect x="24" y="56" width="632" height="32" rx="7" class="card"/><text x="40" y="77" class="">1 Landing</text><text x="200" y="77" class="s">what this is and how to install</text><rect x="24" y="96" width="632" height="32" rx="7" class="strong"/><text x="40" y="117" class="tonet">2 Roadmap</text><text x="200" y="117" class="s">plugin now, open-source app next</text><rect x="24" y="136" width="632" height="32" rx="7" class="card"/><text x="40" y="157" class="">3 State</text><text x="200" y="157" class="s">what works today</text><rect x="24" y="176" width="632" height="32" rx="7" class="card"/><text x="40" y="197" class="">4 Systems</text><text x="200" y="197" class="s">how the pipeline works</text><rect x="24" y="216" width="632" height="32" rx="7" class="card"/><text x="40" y="237" class="">5 Today</text><text x="200" y="237" class="s">what is being worked on</text><rect x="24" y="256" width="632" height="32" rx="7" class="card"/><text x="40" y="277" class="">6 Decisions</text><text x="200" y="277" class="s">why things changed, dated</text></svg>