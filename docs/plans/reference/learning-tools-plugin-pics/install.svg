<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" role="img"><title>Two commands install the plugin; changes merged to main reach every session</title><defs><style>
svg{--bg:#f6f8f7;--card:#ffffff;--ink:#1f2a29;--soft:#55625f;--rule:#cfd9d5;--tone:#2c6684;--tint:#e3eef3;--ok:#2f7a4d;--oktint:#e2f1e7;--draft:#9a6a12;--drafttint:#f7eedb}
@media (prefers-color-scheme: dark){svg{--bg:#161c1c;--card:#1e2726;--ink:#e2ebe8;--soft:#a9b8b4;--rule:#3a4846;--tone:#8cc3dd;--tint:#1f3440;--ok:#7fd1a0;--oktint:#1d3326;--draft:#f0c070;--drafttint:#3a2f1a}}
text{font-family:Verdana,Tahoma,sans-serif;fill:var(--ink);font-size:14px}
.bg{fill:var(--bg)} .h{font-size:16px;font-weight:700} .s{fill:var(--soft);font-size:13px} .m{font-family:Consolas,Menlo,monospace;font-size:13.5px}
.card{fill:var(--card);stroke:var(--rule);stroke-width:1.5} .strong{fill:var(--tint);stroke:var(--tone);stroke-width:2}
.ok{fill:var(--oktint);stroke:var(--ok);stroke-width:2} .draft{fill:var(--drafttint);stroke:var(--draft);stroke-width:2;stroke-dasharray:6 4}
.okt{fill:var(--ok);font-weight:700} .draftt{fill:var(--draft);font-weight:700} .tone{fill:var(--tone)} .tonet{fill:var(--tone);font-weight:700}
.line{stroke:var(--tone);stroke-width:2;fill:none} .rule{stroke:var(--rule);stroke-width:1.5;fill:none} .dash{stroke:var(--tone);stroke-width:2;fill:none;stroke-dasharray:6 5}
.dot{fill:var(--tone)} .dott{fill:var(--card);font-size:13px;font-weight:700}
</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tone"/></marker></defs><rect class="bg" width="680" height="284" rx="10"/><text x="24" y="34" class="h">Install once, then it updates from main</text><rect x="24" y="58" width="300" height="104" rx="9" class="card"/><text x="40" y="84" class="s">In Claude Code, type:</text><text x="40" y="112" class="m">/plugin marketplace add</text><text x="56" y="130" class="m">Ajw2003/AjsLearningTools</text><text x="40" y="152" class="m">/plugin install learning-tools</text><path class="line" d="M330 110H380" marker-end="url(#a)"/><rect x="388" y="58" width="268" height="104" rx="9" class="strong"/><text x="404" y="88" class="tonet">Ready in every session</text><text x="404" y="114">Type /learn next</text><text x="404" y="136">to get today's lesson.</text><rect x="388" y="200" width="268" height="60" rx="9" class="card"/><text x="404" y="226">A change merged to main</text><text x="404" y="246" class="s">reaches you on the next update</text><path class="dash" d="M522 198V166" marker-end="url(#a)"/><text x="24" y="226" class="s">The exact commands are tested in my</text><text x="24" y="246" class="s">sandbox first, then given to you to run.</text></svg>