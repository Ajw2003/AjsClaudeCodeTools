</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tone"/></marker></defs><rect class="bg" width="680" height="340" rx="10"/><text x="24" y="34" class="h">What is in the new repo</text><text x="40" y="70" class="tonet m">AjsLearningTools/</text><text x="400" y="70" class="s">the new repo, installs from main</text><path class="rule" d="M52 82V95H62"/><text x="66" y="100" class="m">.claude-plugin/marketplace.json</text><text x="400" y="100" class="s">tells Claude Code what to install</text><path class="rule" d="M52 112V125H62"/><text x="66" y="130" class="tonet m">plugins/learning-tools/</text><text x="400" y="130" class="s">the plugin itself</text><path class="rule" d="M78 142V155H88"/><text x="92" y="160" class="m">.claude-plugin/plugin.json</text><text x="400" y="160" class="s">name and version</text><path class="rule" d="M78 172V185H88"/><text x="92" y="190" class="m">skills/learn/SKILL.md</text><text x="400" y="190" class="s">the /learn steps</text><path class="rule" d="M78 202V215H88"/><text x="92" y="220" class="m">scripts/</text><text x="400" y="220" class="s">page builder and checks</text><path class="rule" d="M78 232V245H88"/><text x="92" y="250" class="m">templates/stable/  draft/</text><text x="400" y="250" class="s">frozen and work-in-progress rules</text><path class="rule" d="M78 262V275H88"/><text x="92" y="280" class="m">examples/</text><text x="400" y="280" class="s">lesson 1 as the reference</text><path class="rule" d="M52 292V305H62"/><text x="66" y="310" class="m">docs/</text><text x="400" y="310" class="s">the six documentation tiers</text></svg>