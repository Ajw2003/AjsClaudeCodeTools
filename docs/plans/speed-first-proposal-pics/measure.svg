<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140" font-family="system-ui,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs><rect width="480" height="140" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" text-anchor="start" fill="#1f2937">A timing script replays real hook calls</text><rect x="20" y="44" width="120" height="44" rx="6" fill="#e3eafc" stroke="#1f2937" stroke-width="1.2"/><text x="80.0" y="70.0" text-anchor="middle" font-size="12" fill="#1f2937">Write call</text><line x1="140" y1="66" x2="180" y2="66" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="44" width="120" height="44" rx="6" fill="#e3eafc" stroke="#1f2937" stroke-width="1.2"/><text x="240.0" y="70.0" text-anchor="middle" font-size="12" fill="#1f2937">hooks run</text><line x1="300" y1="66" x2="340" y2="66" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><rect x="340" y="44" width="120" height="44" rx="6" fill="#e3eafc" stroke="#1f2937" stroke-width="1.2"/><text x="400.0" y="70.0" text-anchor="middle" font-size="12" fill="#1f2937">ms per call</text><text x="20" y="120" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937">Saved before and after, so &quot;faster&quot; is a number.</text></svg>