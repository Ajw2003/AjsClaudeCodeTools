<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" font-family="system-ui,sans-serif"><style>.bg{fill:#fff}.o{fill:#1f2937}@media (prefers-color-scheme:dark){.bg{fill:#111827}.o{fill:#e5e7eb}}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect class="bg" width="480" height="160"/><text class="o" x="20" y="28" font-size="18" font-weight="700">A timing script replays real hook calls</text><rect x="20" y="50" width="120" height="50" rx="6" fill="#e3eafc" stroke="#1f2937" stroke-width="1.2"/><text x="80.0" y="80.0" text-anchor="middle" font-size="16" fill="#1f2937">Write call</text><line x1="140" y1="75" x2="180" y2="75" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="50" width="120" height="50" rx="6" fill="#e3eafc" stroke="#1f2937" stroke-width="1.2"/><text x="240.0" y="80.0" text-anchor="middle" font-size="16" fill="#1f2937">hooks run</text><line x1="300" y1="75" x2="340" y2="75" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="50" width="120" height="50" rx="6" fill="#e3eafc" stroke="#1f2937" stroke-width="1.2"/><text x="400.0" y="80.0" text-anchor="middle" font-size="16" fill="#1f2937">ms per call</text><text class="o" x="20" y="140" font-size="16" font-weight="400">The numbers are saved before and after.</text></svg>