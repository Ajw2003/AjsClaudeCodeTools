<g><rect x="370" y="114" width="250" height="38" rx="8" fill="#eef0f3" stroke="#98a2b3"/><text x="384" y="138" fill="#1d2433">1. Plan the animations</text>
<rect x="370" y="162" width="250" height="38" rx="8" fill="#eef0f3" stroke="#98a2b3"/><text x="384" y="186" fill="#1d2433">2. Build the rigs</text>
