<rect x="370" y="258" width="250" height="38" rx="8" fill="#eef0f3" stroke="#98a2b3"/><text x="384" y="282" fill="#1d2433">4. Implement in engine</text>
<rect x="370" y="306" width="250" height="38" rx="8" fill="#fdeed9" stroke="#b35f00" stroke-width="2"/><text x="384" y="330" fill="#7a4100" font-weight="700">5. Review (your move)</text></g>
<text x="632" y="138" fill="#555f6d" font-size="12">each says</text><text x="632" y="154" fill="#555f6d" font-size="12">"Part of" the</text><text x="632" y="170" fill="#555f6d" font-size="12">main issue</text>
