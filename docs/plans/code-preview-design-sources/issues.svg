<text x="44" y="94" font-weight="700" fill="#1d2433">Fix the save button</text><text x="44" y="112" fill="#555f6d">the only issue</text>
<line x1="290" y1="20" x2="290" y2="360" stroke="#d0d5dd"/>
<text x="320" y="36" font-size="15" font-weight="700" fill="#1d2433">Large feature: one issue, then one per large step</text>
