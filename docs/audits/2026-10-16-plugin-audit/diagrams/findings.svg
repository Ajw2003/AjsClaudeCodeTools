<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 402" role="img" aria-label="Audit findings counted by kind"><style>
  .bg{fill:#ffffff} .ink{fill:#1f2328} .mute{fill:#59636e} .line{stroke:#8c959f}
  .box{fill:#f6f8fa;stroke:#8c959f} .hot{fill:#ffebe9;stroke:#cf222e} .warm{fill:#fff8c5;stroke:#9a6700}
  .cool{fill:#ddf4ff;stroke:#0969da} .ok{fill:#dafbe1;stroke:#1a7f37} .bar{fill:#cf222e} .bar2{fill:#9a6700}
  text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .ink{fill:#e6edf3} .mute{fill:#9198a1} .line{stroke:#6e7681}
    .box{fill:#161b22;stroke:#6e7681} .hot{fill:#3c1618;stroke:#f85149} .warm{fill:#2e2a12;stroke:#d29922}
    .cool{fill:#0c2d4a;stroke:#4493f8} .ok{fill:#0f2e1a;stroke:#3fb950} .bar{fill:#f85149} .bar2{fill:#d29922}
  }
</style><rect class="bg" width="1000" height="402"/><text x="20" y="32" class="ink" font-size="18" text-anchor="start" font-weight="bold">What the audit found, counted</text><text x="20" y="52" class="mute" font-size="12" text-anchor="start" font-weight="normal">Red: one part says the opposite of another. Amber: drift, silence or personal data.</text><text x="20" y="92" class="ink" font-size="13" text-anchor="start" font-weight="normal">Rule against rule</text><rect x="330" y="76" width="252" height="22" rx="3" class="bar"/><text x="590" y="92" class="ink" font-size="13" text-anchor="start" font-weight="bold">28</text><text x="20" y="126" class="ink" font-size="13" text-anchor="start" font-weight="normal">Doc against code</text><rect x="330" y="110" width="180" height="22" rx="3" class="bar"/><text x="518" y="126" class="ink" font-size="13" text-anchor="start" font-weight="bold">20</text><text x="20" y="160" class="ink" font-size="13" text-anchor="start" font-weight="normal">Code logic against code logic</text><rect x="330" y="144" width="135" height="22" rx="3" class="bar"/><text x="473" y="160" class="ink" font-size="13" text-anchor="start" font-weight="bold">15</text><text x="20" y="194" class="ink" font-size="13" text-anchor="start" font-weight="normal">Doc against doc</text><rect x="330" y="178" width="72" height="22" rx="3" class="bar"/><text x="410" y="194" class="ink" font-size="13" text-anchor="start" font-weight="bold">8</text><text x="20" y="228" class="ink" font-size="13" text-anchor="start" font-weight="normal">Script against script</text><rect x="330" y="212" width="27" height="22" rx="3" class="bar"/><text x="365" y="228" class="ink" font-size="13" text-anchor="start" font-weight="bold">3</text><text x="20" y="262" class="ink" font-size="13" text-anchor="start" font-weight="normal">Stale file:line citations</text><rect x="330" y="246" width="90" height="22" rx="3" class="bar2"/><text x="428" y="262" class="ink" font-size="13" text-anchor="start" font-weight="bold">10</text><text x="20" y="296" class="ink" font-size="13" text-anchor="start" font-weight="normal">Duplicated rule text</text><rect x="330" y="280" width="81" height="22" rx="3" class="bar2"/><text x="419" y="296" class="ink" font-size="13" text-anchor="start" font-weight="bold">9</text><text x="20" y="330" class="ink" font-size="13" text-anchor="start" font-weight="normal">Entry points silent without Python</text><rect x="330" y="314" width="180" height="22" rx="3" class="bar2"/><text x="518" y="330" class="ink" font-size="13" text-anchor="start" font-weight="bold">20</text><text x="20" y="364" class="ink" font-size="13" text-anchor="start" font-weight="normal">Shipped lines naming one person (15 files)</text><rect x="330" y="348" width="558" height="22" rx="3" class="bar2"/><text x="896" y="364" class="ink" font-size="13" text-anchor="start" font-weight="bold">62</text></svg>
