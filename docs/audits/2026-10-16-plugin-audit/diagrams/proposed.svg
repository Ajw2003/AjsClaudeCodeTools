<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-label="Proposed plugin structure"><style>
  .bg{fill:#ffffff} .ink{fill:#1f2328} .mute{fill:#59636e} .line{stroke:#8c959f}
  .box{fill:#f6f8fa;stroke:#8c959f} .hot{fill:#ffebe9;stroke:#cf222e} .warm{fill:#fff8c5;stroke:#9a6700}
  .cool{fill:#ddf4ff;stroke:#0969da} .ok{fill:#dafbe1;stroke:#1a7f37} .bar{fill:#cf222e} .bar2{fill:#9a6700}
  text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .ink{fill:#e6edf3} .mute{fill:#9198a1} .line{stroke:#6e7681}
    .box{fill:#161b22;stroke:#6e7681} .hot{fill:#3c1618;stroke:#f85149} .warm{fill:#2e2a12;stroke:#d29922}
    .cool{fill:#0c2d4a;stroke:#4493f8} .ok{fill:#0f2e1a;stroke:#3fb950} .bar{fill:#f85149} .bar2{fill:#d29922}
  }
</style><rect class="bg" width="1100" height="480"/><text x="20" y="32" class="ink" font-size="18" text-anchor="start" font-weight="bold">Proposed: a shared core and five optional sub-plugins</text><rect x="250" y="330" width="600" height="96" rx="8" class="ok" stroke-width="1.5"/><text x="550" y="358" class="ink" font-size="16" text-anchor="middle" font-weight="bold">house-rules core</text><text x="550" y="380" class="mute" font-size="12" text-anchor="middle" font-weight="normal">hook runner, one config file (name, credit, labels, owner), one state store,</text><text x="550" y="398" class="mute" font-size="12" text-anchor="middle" font-weight="normal">git and transcript helpers, rule loading from one source per rule</text><text x="550" y="416" class="mute" font-size="12" text-anchor="middle" font-weight="normal">every failure says so</text><rect x="20" y="90" width="200" height="120" rx="8" class="cool" stroke-width="1.5"/><text x="120" y="120" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Safe git</text><text x="120" y="146" class="mute" font-size="12" text-anchor="middle" font-weight="normal">guard, overwrite guard,</text><text x="120" y="164" class="mute" font-size="12" text-anchor="middle" font-weight="normal">credit check, prompt timer</text><line x1="120" y1="210" x2="300" y2="330" class="line" stroke-width="1.5"/><rect x="236" y="90" width="200" height="120" rx="8" class="cool" stroke-width="1.5"/><text x="336" y="120" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Design loop</text><text x="336" y="146" class="mute" font-size="12" text-anchor="middle" font-weight="normal">stages, approvals, issues,</text><text x="336" y="164" class="mute" font-size="12" text-anchor="middle" font-weight="normal">pages, QA, end-of-reply checks</text><line x1="336" y1="210" x2="408" y2="330" class="line" stroke-width="1.5"/><rect x="452" y="90" width="200" height="120" rx="8" class="cool" stroke-width="1.5"/><text x="552" y="120" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Writing</text><text x="552" y="146" class="mute" font-size="12" text-anchor="middle" font-weight="normal">one clarity checker,</text><text x="552" y="164" class="mute" font-size="12" text-anchor="middle" font-weight="normal">editor helper, plain docs</text><line x1="552" y1="210" x2="516" y2="330" class="line" stroke-width="1.5"/><rect x="668" y="90" width="200" height="120" rx="8" class="cool" stroke-width="1.5"/><text x="768" y="120" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Delegation</text><text x="768" y="146" class="mute" font-size="12" text-anchor="middle" font-weight="normal">helpers, cap, audit,</text><text x="768" y="164" class="mute" font-size="12" text-anchor="middle" font-weight="normal">worktree autosave</text><line x1="768" y1="210" x2="624" y2="330" class="line" stroke-width="1.5"/><rect x="884" y="90" width="200" height="120" rx="8" class="cool" stroke-width="1.5"/><text x="984" y="120" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Docs</text><text x="984" y="146" class="mute" font-size="12" text-anchor="middle" font-weight="normal">doc tiers, harvest,</text><text x="984" y="164" class="mute" font-size="12" text-anchor="middle" font-weight="normal">doc-ref, archivist</text><line x1="984" y1="210" x2="732" y2="330" class="line" stroke-width="1.5"/><text x="20" y="70" class="mute" font-size="13" text-anchor="start" font-weight="normal">Each sub-plugin installs on its own and talks to the others only through the core.</text><text x="20" y="460" class="mute" font-size="13" text-anchor="start" font-weight="normal">Goes: the self-updater, the hardcoded identity, the old step-card template, text-drift tests.</text></svg>
