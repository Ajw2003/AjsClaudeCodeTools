<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-label="Proposed plugin structure"><style>
  .bg{fill:#ffffff} .ink{fill:#1f2328} .mute{fill:#59636e} .line{stroke:#8c959f}
  .box{fill:#f6f8fa;stroke:#8c959f} .hot{fill:#ffebe9;stroke:#cf222e} .warm{fill:#fff8c5;stroke:#9a6700}
  .cool{fill:#ddf4ff;stroke:#0969da} .ok{fill:#dafbe1;stroke:#1a7f37} .bar{fill:#cf222e} .bar2{fill:#9a6700}
  text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .ink{fill:#e6edf3} .mute{fill:#9198a1} .line{stroke:#6e7681}
    .box{fill:#161b22;stroke:#6e7681} .hot{fill:#3c1618;stroke:#f85149} .warm{fill:#2e2a12;stroke:#d29922}
    .cool{fill:#0c2d4a;stroke:#4493f8} .ok{fill:#0f2e1a;stroke:#3fb950} .bar{fill:#f85149} .bar2{fill:#d29922}
  }
</style><rect class="bg" width="1100" height="480"/><text x="20" y="32" class="ink" font-size="18" text-anchor="start" font-weight="bold">Proposed: a shared core and six optional sub-plugins</text><rect x="220" y="320" width="660" height="112" rx="8" class="ok" stroke-width="1.5"/><text x="550" y="346" class="ink" font-size="16" text-anchor="middle" font-weight="bold">house-rules core</text><text x="550" y="368" class="mute" font-size="12" text-anchor="middle" font-weight="normal">project boundaries: which repo each message belongs to, state kept per repo,</text><text x="550" y="386" class="mute" font-size="12" text-anchor="middle" font-weight="normal">other repos' work becomes an issue there; one config (userConfig), one state store,</text><text x="550" y="404" class="mute" font-size="12" text-anchor="middle" font-weight="normal">git and transcript helpers, one source per rule; every failure says so</text><rect x="20" y="90" width="166" height="130" rx="8" class="cool" stroke-width="1.5"/><text x="103" y="118" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Safe git</text><text x="103" y="144" class="mute" font-size="12" text-anchor="middle" font-weight="normal">guard, overwrite guard,</text><text x="103" y="162" class="mute" font-size="12" text-anchor="middle" font-weight="normal">credit check,</text><text x="103" y="180" class="mute" font-size="12" text-anchor="middle" font-weight="normal">prompt timer</text><line x1="103" y1="220" x2="260" y2="320" class="line" stroke-width="1.5"/><rect x="198" y="90" width="166" height="130" rx="8" class="cool" stroke-width="1.5"/><text x="281" y="118" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Design loop</text><text x="281" y="144" class="mute" font-size="12" text-anchor="middle" font-weight="normal">stages, approvals,</text><text x="281" y="162" class="mute" font-size="12" text-anchor="middle" font-weight="normal">pages, QA, after-PR</text><text x="281" y="180" class="mute" font-size="12" text-anchor="middle" font-weight="normal">checks, visuals</text><line x1="281" y1="220" x2="374" y2="320" class="line" stroke-width="1.5"/><rect x="376" y="90" width="166" height="130" rx="8" class="cool" stroke-width="1.5"/><text x="459" y="118" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Session triage</text><text x="459" y="144" class="mute" font-size="12" text-anchor="middle" font-weight="normal">clean a transcript,</text><text x="459" y="162" class="mute" font-size="12" text-anchor="middle" font-weight="normal">then file issues</text><text x="459" y="180" class="mute" font-size="12" text-anchor="middle" font-weight="normal">from it</text><line x1="459" y1="220" x2="489" y2="320" class="line" stroke-width="1.5"/><rect x="554" y="90" width="166" height="130" rx="8" class="cool" stroke-width="1.5"/><text x="637" y="118" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Writing</text><text x="637" y="144" class="mute" font-size="12" text-anchor="middle" font-weight="normal">one clarity checker,</text><text x="637" y="162" class="mute" font-size="12" text-anchor="middle" font-weight="normal">editor helper,</text><text x="637" y="180" class="mute" font-size="12" text-anchor="middle" font-weight="normal">plain docs</text><line x1="637" y1="220" x2="604" y2="320" class="line" stroke-width="1.5"/><rect x="732" y="90" width="166" height="130" rx="8" class="cool" stroke-width="1.5"/><text x="815" y="118" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Delegation</text><text x="815" y="144" class="mute" font-size="12" text-anchor="middle" font-weight="normal">helpers, cap,</text><text x="815" y="162" class="mute" font-size="12" text-anchor="middle" font-weight="normal">audit, worktree</text><text x="815" y="180" class="mute" font-size="12" text-anchor="middle" font-weight="normal">autosave</text><line x1="815" y1="220" x2="718" y2="320" class="line" stroke-width="1.5"/><rect x="910" y="90" width="166" height="130" rx="8" class="cool" stroke-width="1.5"/><text x="993" y="118" class="ink" font-size="15" text-anchor="middle" font-weight="bold">Docs</text><text x="993" y="144" class="mute" font-size="12" text-anchor="middle" font-weight="normal">doc tiers, harvest,</text><text x="993" y="162" class="mute" font-size="12" text-anchor="middle" font-weight="normal">doc-ref, archivist</text><line x1="993" y1="220" x2="833" y2="320" class="line" stroke-width="1.5"/><text x="20" y="70" class="mute" font-size="13" text-anchor="start" font-weight="normal">Each sub-plugin installs on its own and talks to the others only through the core.</text><text x="20" y="460" class="mute" font-size="13" text-anchor="start" font-weight="normal">Goes: the self-updater, the hardcoded identity, the old step-card template, text-drift tests.</text></svg>
